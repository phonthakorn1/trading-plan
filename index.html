<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Plan — BUY &amp; SELL</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c12;
  --surface: #0f1620;
  --surface2: #161f2e;
  --border: #1c2b40;
  --text: #b8cce0;
  --text-dim: #4a6480;
  --text-bright: #e8f2ff;
  --buy: #00e896;
  --buy-dim: rgba(0,232,150,0.12);
  --buy-border: rgba(0,232,150,0.3);
  --sell: #ff4466;
  --sell-dim: rgba(255,68,102,0.12);
  --sell-border: rgba(255,68,102,0.3);
  --neutral: #00b4d8;
  --gold: #ffc940;
  --active-accent: var(--buy);
  --active-dim: var(--buy-dim);
  --active-border: var(--buy-border);
}
.mode-sell { --active-accent:var(--sell); --active-dim:var(--sell-dim); --active-border:var(--sell-border); }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans Thai',sans-serif; min-height:100vh; }

/* ── LOGIN SCREEN ── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: radial-gradient(ellipse at 50% 0%, rgba(0,180,216,0.07) 0%, transparent 60%), var(--bg);
}
.login-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 28px 28px;
  width: 100%;
  max-width: 360px;
}
.login-logo {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo .l-tag {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.login-logo h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-bright);
}
.login-logo h2 span { color: var(--neutral); }

.login-field { margin-bottom: 14px; }
.login-field label {
  font-size: 10px; color: var(--text-dim);
  letter-spacing: 1px; text-transform: uppercase;
  display: block; margin-bottom: 6px;
}
.login-field input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-bright);
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 8px;
  outline: none;
  transition: border-color .2s;
}
.login-field input:focus { border-color: var(--neutral); }

.login-error {
  background: rgba(255,68,102,0.1);
  border: 1px solid rgba(255,68,102,0.3);
  color: var(--sell);
  font-size: 12px;
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 14px;
  display: none;
}
.login-error.show { display: block; }

.btn-login {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #0090b8, var(--neutral));
  border: none;
  border-radius: 8px;
  color: #001820;
  font-family: 'Noto Sans Thai', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  margin-top: 4px;
}
.btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,180,216,0.3); }

.login-hint {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.login-hint p {
  font-size: 10px; color: var(--text-dim);
  letter-spacing: 1px; margin-bottom: 8px;
  text-transform: uppercase;
  font-family: 'Space Mono', monospace;
}
.user-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.user-pill {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
  font-family: 'Space Mono', monospace;
}
.user-pill:hover { color: var(--text-bright); border-color: var(--text-dim); }

/* ── APP SCREEN ── */
#app-screen { display: none; padding-bottom: 80px; }

/* TOPBAR */
.topbar {
  background: linear-gradient(160deg,#0b1524 0%,#080c12 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.topbar-left .tb-tag {
  font-family: 'Space Mono', monospace;
  font-size: 9px; letter-spacing: 3px;
  color: var(--text-dim);
}
.topbar-left h1 { font-size: 16px; font-weight: 700; color: var(--text-bright); }
.user-badge {
  display: flex; align-items: center; gap: 8px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 12px; font-weight: 700;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--neutral);
}
.user-name { font-size: 12px; color: var(--text-bright); font-weight: 600; }
.btn-logout {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  padding: 4px 8px; border-radius: 4px;
  cursor: pointer; transition: all .15s;
}
.btn-logout:hover { color: var(--sell); border-color: var(--sell); }

/* MODE TOGGLE */
.mode-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: center;
  padding: 0 16px;
}
.mode-toggle { display:flex; max-width:400px; width:100%; }
.mode-btn {
  flex:1; padding:11px 0;
  border:none; background:transparent;
  font-family:'Space Mono',monospace;
  font-size:12px; font-weight:700; letter-spacing:2px;
  cursor:pointer; transition:all .25s; color:var(--text-dim);
}
.mode-btn.buy.active  { color:var(--buy);  border-bottom:2px solid var(--buy); }
.mode-btn.sell.active { color:var(--sell); border-bottom:2px solid var(--sell); }
.mode-btn:not(.active):hover { color:var(--text); }

/* STATS */
.stats-wrap { background:var(--surface); border-bottom:1px solid var(--border); }
.stats-tabs { display:flex; border-bottom:1px solid var(--border); }
.stats-tab {
  flex:1; padding:6px; text-align:center;
  font-size:10px; font-family:'Space Mono',monospace;
  letter-spacing:1px; color:var(--text-dim);
  cursor:pointer; transition:all .2s; border-bottom:2px solid transparent;
}
.stats-tab.buy.active  { color:var(--buy);  border-bottom-color:var(--buy); }
.stats-tab.sell.active { color:var(--sell); border-bottom-color:var(--sell); }
.stats-tab.all.active  { color:var(--neutral); border-bottom-color:var(--neutral); }
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); }
.stat-box { background:var(--surface); padding:11px 8px; text-align:center; }
.stat-val { font-family:'Space Mono',monospace; font-size:18px; font-weight:700; color:var(--neutral); line-height:1; }
.stat-val.win  { color:var(--buy); }
.stat-val.lose { color:var(--sell); }
.stat-val.rate { color:var(--gold); }
.stat-label { font-size:9px; color:var(--text-dim); margin-top:3px; letter-spacing:1px; text-transform:uppercase; }
.winrate-bar-wrap { display:flex; align-items:center; gap:10px; padding:8px 16px; }
.winrate-label { font-size:10px; color:var(--text-dim); font-family:'Space Mono',monospace; min-width:56px; }
.winrate-track { flex:1; height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; }
.winrate-fill { height:100%; border-radius:3px; transition:width .5s cubic-bezier(.4,0,.2,1); background:linear-gradient(90deg,var(--buy),#00ffaa); }
.winrate-fill.sell-fill { background:linear-gradient(90deg,#cc1133,var(--sell)); }
.winrate-fill.all-fill  { background:linear-gradient(90deg,var(--neutral),#80e0ff); }
.winrate-pct { font-family:'Space Mono',monospace; font-size:12px; color:var(--gold); min-width:42px; text-align:right; }

/* MAIN */
.main { max-width:680px; margin:0 auto; padding:16px 14px 0; }
.trade-meta { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
.trade-meta-title { font-family:'Space Mono',monospace; font-size:10px; color:var(--active-accent); letter-spacing:2px; margin-bottom:10px; transition:color .3s; }
.meta-row { display:flex; gap:8px; flex-wrap:wrap; }
.meta-field { flex:1; min-width:120px; }
.meta-field label { font-size:9px; color:var(--text-dim); letter-spacing:1px; display:block; margin-bottom:4px; text-transform:uppercase; }
.meta-field input, .meta-field select { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text-bright); font-family:'Space Mono',monospace; font-size:12px; padding:7px 10px; border-radius:6px; outline:none; transition:border-color .2s; }
.meta-field input:focus,.meta-field select:focus { border-color:var(--active-accent); }
.meta-field select option { background:var(--surface2); }

.cond-bar { display:flex; align-items:center; justify-content:space-between; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:14px; }
.cond-label { font-size:12px; color:var(--text-dim); }
.cond-nums { display:flex; align-items:center; gap:10px; font-family:'Space Mono',monospace; }
.cond-big { font-size:18px; color:var(--text-bright); }
.cond-big span { color:var(--active-accent); transition:color .3s; }
.cond-of { font-size:12px; color:var(--text-dim); }
.cond-mini-track { width:100px; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.cond-mini-fill { height:100%; background:linear-gradient(90deg,var(--active-accent),#80ffd0); border-radius:2px; transition:width .3s ease,background .3s; }
.mode-sell .cond-mini-fill { background:linear-gradient(90deg,var(--sell),#ff8899); }

.section { background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden; transition:border-color .2s; }
.section.has-checks { border-color:var(--active-border); }
.section-header { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; user-select:none; transition:background .15s; }
.section-header:hover { background:var(--surface2); }
.section-num { font-family:'Space Mono',monospace; font-size:10px; color:var(--active-accent); background:var(--active-dim); border:1px solid var(--active-border); border-radius:4px; padding:2px 6px; min-width:26px; text-align:center; transition:color .3s,background .3s,border-color .3s; }
.section-title { flex:1; font-size:12px; font-weight:600; color:var(--text-bright); line-height:1.4; }
.section-badge { font-family:'Space Mono',monospace; font-size:9px; padding:2px 7px; border-radius:8px; background:var(--surface2); color:var(--text-dim); transition:all .2s; }
.section-badge.partial { color:var(--active-accent); background:var(--active-dim); }
.section-badge.full    { color:var(--buy); background:rgba(0,232,150,0.15); }
.mode-sell .section-badge.full { color:var(--sell); background:rgba(255,68,102,0.15); }
.chevron { color:var(--text-dim); font-size:11px; transition:transform .2s; }
.section.collapsed .chevron { transform:rotate(-90deg); }
.section-body { border-top:1px solid var(--border); }
.section.collapsed .section-body { display:none; }

.check-item { display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-bottom:1px solid rgba(28,43,64,0.6); cursor:pointer; transition:background .12s; }
.check-item:last-child { border-bottom:none; }
.check-item:hover { background:rgba(255,255,255,0.02); }
.custom-check { width:17px; height:17px; min-width:17px; border:1.5px solid var(--border); border-radius:4px; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .18s; background:var(--surface2); }
.check-item.checked .custom-check { background:var(--active-accent); border-color:var(--active-accent); }
.mode-sell .check-item.checked .custom-check { background:var(--sell); border-color:var(--sell); }
.custom-check svg { display:none; }
.check-item.checked .custom-check svg { display:block; }
.check-sub { font-family:'Space Mono',monospace; font-size:9px; color:var(--text-dim); margin-top:3px; white-space:nowrap; }
.check-text { font-size:12px; color:var(--text); line-height:1.5; transition:color .2s; }
.check-item.checked .check-text { color:var(--active-accent); text-decoration:line-through; text-decoration-color:rgba(0,232,150,0.35); }
.mode-sell .check-item.checked .check-text { color:var(--sell); text-decoration-color:rgba(255,68,102,0.35); }

.action-row { display:flex; gap:8px; margin-top:16px; }
.btn { flex:1; padding:13px; border:none; border-radius:8px; font-family:'Noto Sans Thai',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:all .2s; }
.btn-win  { background:linear-gradient(135deg,#00b86a,#00e896); color:#001f10; }
.btn-win:hover  { transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,232,150,0.3); }
.btn-lose { background:linear-gradient(135deg,#cc0028,#ff4466); color:#1a0008; }
.btn-lose:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(255,68,102,0.3); }
.btn-reset { flex:0.4; background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); font-size:11px; }
.btn-reset:hover { color:var(--text); border-color:var(--text-dim); }

.history-header { display:flex; align-items:center; justify-content:space-between; margin-top:26px; margin-bottom:10px; }
.history-title { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); letter-spacing:2px; }
.filter-row { display:flex; gap:6px; }
.filter-btn { font-size:10px; font-family:'Space Mono',monospace; background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:4px; padding:3px 8px; cursor:pointer; transition:all .15s; }
.filter-btn.active { color:var(--text-bright); border-color:var(--text-dim); }
.btn-clear { font-size:10px; color:var(--text-dim); background:none; border:1px solid var(--border); border-radius:4px; padding:3px 8px; cursor:pointer; font-family:'Space Mono',monospace; transition:all .15s; }
.btn-clear:hover { color:var(--sell); border-color:var(--sell); }

.history-list { display:flex; flex-direction:column; gap:5px; }
.history-item { background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:9px 12px; display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:10px; animation:fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(3px)} to{opacity:1} }
.h-type { font-family:'Space Mono',monospace; font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; }
.h-type.buy  { background:var(--buy-dim);  color:var(--buy);  border:1px solid var(--buy-border); }
.h-type.sell { background:var(--sell-dim); color:var(--sell); border:1px solid var(--sell-border); }
.h-pair { font-family:'Space Mono',monospace; font-size:12px; color:var(--text-bright); }
.h-sub  { font-size:10px; color:var(--text-dim); }
.h-cond { font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); background:var(--surface2); border-radius:4px; padding:2px 6px; white-space:nowrap; }
.h-result { font-family:'Space Mono',monospace; font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; }
.h-result.win  { background:rgba(0,232,150,0.1); color:var(--buy); }
.h-result.lose { background:rgba(255,68,102,0.1); color:var(--sell); }
.empty-history { text-align:center; padding:28px; color:var(--text-dim); font-size:12px; border:1px dashed var(--border); border-radius:8px; }
::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="l-tag">Smart Money Concept</div>
      <h2>Trading <span>Plan</span></h2>
    </div>
    <div class="login-field">
      <label>Username</label>
      <input type="text" id="inp-user" placeholder="ใส่ชื่อผู้ใช้..." autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="inp-pass" placeholder="ใส่รหัสผ่าน..." onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-error" id="login-error">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
    <button class="btn-login" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="login-hint">
      <p>▸ บัญชีผู้ใช้</p>
      <div class="user-pills" id="user-pills"></div>
    </div>
  </div>
</div>

<!-- ═══ APP SCREEN ═══ -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="tb-tag">SMC Trading Plan</div>
      <h1>BUY &amp; SELL Checklist</h1>
    </div>
    <div class="user-badge">
      <div class="user-avatar" id="user-avatar">—</div>
      <div class="user-name" id="user-name-display">—</div>
      <button class="btn-logout" onclick="doLogout()">ออก</button>
    </div>
  </div>

  <div class="mode-bar">
    <div class="mode-toggle">
      <button class="mode-btn buy active" onclick="setMode('buy')">▲ BUY</button>
      <button class="mode-btn sell" onclick="setMode('sell')">▼ SELL</button>
    </div>
  </div>

  <div class="stats-wrap">
    <div class="stats-tabs">
      <div class="stats-tab buy active" onclick="setStatTab('buy')">BUY</div>
      <div class="stats-tab sell" onclick="setStatTab('sell')">SELL</div>
      <div class="stats-tab all" onclick="setStatTab('all')">ALL</div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val" id="st-total">0</div><div class="stat-label">ทั้งหมด</div></div>
      <div class="stat-box"><div class="stat-val win" id="st-win">0</div><div class="stat-label">Win</div></div>
      <div class="stat-box"><div class="stat-val lose" id="st-lose">0</div><div class="stat-label">Lose</div></div>
      <div class="stat-box"><div class="stat-val rate" id="st-rate">—</div><div class="stat-label">Winrate</div></div>
    </div>
    <div class="winrate-bar-wrap">
      <div class="winrate-label">WINRATE</div>
      <div class="winrate-track"><div class="winrate-fill" id="wr-fill" style="width:0%"></div></div>
      <div class="winrate-pct" id="wr-pct">0%</div>
    </div>
  </div>

  <div class="main" id="app-main">
    <div class="trade-meta">
      <div class="trade-meta-title" id="meta-title">▸ ข้อมูลเทรด — BUY</div>
      <div class="meta-row">
        <div class="meta-field">
          <label>คู่เงิน / Symbol</label>
          <input type="text" id="inp-pair" placeholder="XAUUSD, EURUSD ...">
        </div>
        <div class="meta-field">
          <label>Timeframe</label>
          <select id="inp-tf">
            <option value="">— เลือก —</option>
            <option>M15</option><option>M30</option><option>H1</option><option>H4</option><option>D1</option>
          </select>
        </div>
        <div class="meta-field">
          <label>วันที่</label>
          <input type="date" id="inp-date">
        </div>
      </div>
    </div>

    <div class="cond-bar">
      <div class="cond-label">เงื่อนไขที่เลือก</div>
      <div class="cond-nums">
        <div class="cond-big"><span id="checked-count">0</span> <span class="cond-of">/ <span id="total-count">0</span></span></div>
        <div class="cond-mini-track"><div class="cond-mini-fill" id="cond-fill" style="width:0%"></div></div>
      </div>
    </div>

    <div id="checklist-container"></div>

    <div class="action-row">
      <button class="btn btn-win"  onclick="saveResult('win')">✓ WIN — บันทึกชนะ</button>
      <button class="btn btn-lose" onclick="saveResult('lose')">✗ LOSE — บันทึกแพ้</button>
      <button class="btn btn-reset" onclick="resetChecklist()">↺</button>
    </div>

    <div class="history-header">
      <div class="history-title">▸ TRADE HISTORY</div>
      <div style="display:flex;gap:6px;align-items:center;">
        <div class="filter-row">
          <button class="filter-btn active" id="fb-all"  onclick="setHistFilter('all')">ALL</button>
          <button class="filter-btn" id="fb-buy"  onclick="setHistFilter('buy')">BUY</button>
          <button class="filter-btn" id="fb-sell" onclick="setHistFilter('sell')">SELL</button>
        </div>
        <button class="btn-clear" onclick="clearHistory()">ล้าง</button>
      </div>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<script>
/* ═══ USERS ═══ */
const USERS = [
  { username: 'trader1', password: '1234', display: 'Trader 1' },
  { username: 'trader2', password: '1234', display: 'Trader 2' },
  { username: 'trader3', password: '1234', display: 'Trader 3' },
  { username: 'trader4', password: '1234', display: 'Trader 4' },
  { username: 'trader5', password: '1234', display: 'Trader 5' },
];

/* ═══ PLANS ═══ */

/* ═══ STATE ═══ */
let currentUser = null;
let mode = 'buy';
let statTab = 'buy';
let histFilter = 'all';
let checks = {};

function storageKey(suffix) { return `smc_${currentUser.username}_${suffix}`; }
function getHistory() { return JSON.parse(localStorage.getItem(storageKey('history')) || '[]'); }
function saveHistory(h) { localStorage.setItem(storageKey('history'), JSON.stringify(h)); }

/* ═══ LOGIN ═══ */
function buildUserPills() {
  const pills = document.getElementById('user-pills');
  pills.innerHTML = USERS.map(u =>
    `<div class="user-pill" onclick="fillUser('${u.username}')">${u.display}</div>`
  ).join('');
}
function fillUser(uname) {
  document.getElementById('inp-user').value = uname;
  document.getElementById('inp-pass').focus();
}
function doLogin() {
  const uname = document.getElementById('inp-user').value.trim().toLowerCase();
  const pass  = document.getElementById('inp-pass').value;
  const user  = USERS.find(u => u.username === uname && u.password === pass);
  const err   = document.getElementById('login-error');
  if (!user) { err.classList.add('show'); return; }
  err.classList.remove('show');
  currentUser = user;
  document.getElementById('user-name-display').textContent = user.display;
  document.getElementById('user-avatar').textContent = user.display.charAt(0).toUpperCase();
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  mode = 'buy'; statTab = 'buy'; histFilter = 'all'; checks = {};
  document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);
  buildChecklist();
  renderHistory();
  updateStats();
}
function doLogout() {
  currentUser = null;
  document.getElementById('inp-user').value = '';
  document.getElementById('inp-pass').value = '';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
}

/* ═══ MODE ═══ */
function setMode(m) {
  mode = m; checks = {};
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.mode-btn.${m}`).classList.add('active');
  const main = document.getElementById('app-main');
  main.className = 'main' + (m==='sell' ? ' mode-sell' : '');
  document.getElementById('meta-title').textContent = `▸ ข้อมูลเทรด — ${m.toUpperCase()}`;
  buildChecklist();
}

function totalItems(m) { return PLANS[m].reduce((a,s) => a+s.items.length, 0); }

/* ═══ CHECKLIST ═══ */
function buildChecklist() {
  const plan = PLANS[mode];
  const container = document.getElementById('checklist-container');
  container.innerHTML = '';
  document.getElementById('total-count').textContent = totalItems(mode);
  plan.forEach((section, si) => {
    const div = document.createElement('div');
    div.className = 'section'; div.id = `sec-${si}`;
    div.innerHTML = `
      <div class="section-header" onclick="toggleSection(${si})">
        <span class="section-num">${section.num}</span>
        <span class="section-title">${section.title}</span>
        <span class="section-badge" id="badge-${si}">0/${section.items.length}</span>
        <span class="chevron">▾</span>
      </div>
      <div class="section-body" id="body-${si}">
        ${section.items.map((item,ii) => `
          <div class="check-item" id="item-${si}-${ii}" onclick="toggleCheck(${si},${ii})">
            <div class="custom-check">
              <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
                <path d="M1 4L3.5 6.5L9 1" stroke="#001a0d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="check-sub">${item.sub}</span>
            <span class="check-text">${item.text}</span>
          </div>`).join('')}
      </div>`;
    container.appendChild(div);
  });
  updateCounts();
}

function toggleSection(si) { document.getElementById(`sec-${si}`).classList.toggle('collapsed'); }

function toggleCheck(si,ii) {
  const key = `${si}-${ii}`;
  checks[key] = !checks[key];
  document.getElementById(`item-${si}-${ii}`).classList.toggle('checked', checks[key]);
  updateCounts();
}

function updateCounts() {
  const checked = Object.values(checks).filter(Boolean).length;
  const total = totalItems(mode);
  document.getElementById('checked-count').textContent = checked;
  document.getElementById('cond-fill').style.width = total>0 ? (checked/total*100)+'%' : '0%';
  PLANS[mode].forEach((section,si) => {
    let sc = 0;
    section.items.forEach((_,ii) => { if(checks[`${si}-${ii}`]) sc++; });
    const badge = document.getElementById(`badge-${si}`);
    badge.textContent = `${sc}/${section.items.length}`;
    badge.className = 'section-badge' + (sc===0?'': sc===section.items.length?' full':' partial');
    document.getElementById(`sec-${si}`).classList.toggle('has-checks', sc>0);
  });
}

/* ═══ SAVE ═══ */
function saveResult(result) {
  const pair = document.getElementById('inp-pair').value.trim() || '—';
  const tf   = document.getElementById('inp-tf').value || '—';
  const date = document.getElementById('inp-date').value || new Date().toISOString().slice(0,10);
  const condCount = Object.values(checks).filter(Boolean).length;
  const history = getHistory();
  history.unshift({ pair, tf, date, condCount, totalCond:totalItems(mode), result, mode, ts:Date.now() });
  saveHistory(history);
  renderHistory(); updateStats(); resetChecklist();
  const btn = document.querySelector(result==='win'?'.btn-win':'.btn-lose');
  btn.style.opacity='0.6'; setTimeout(()=>btn.style.opacity='',300);
}

function resetChecklist() {
  checks = {};
  document.querySelectorAll('.check-item').forEach(el => el.classList.remove('checked'));
  document.querySelectorAll('.section').forEach(el => el.classList.remove('has-checks'));
  document.getElementById('inp-pair').value = '';
  document.getElementById('inp-tf').value = '';
  document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);
  updateCounts();
}

/* ═══ STATS ═══ */
function setStatTab(t) {
  statTab = t;
  document.querySelectorAll('.stats-tab').forEach(el => el.classList.remove('active'));
  document.querySelector(`.stats-tab.${t}`).classList.add('active');
  updateStats();
}

function updateStats() {
  const history = getHistory();
  const filtered = statTab==='all' ? history : history.filter(h=>h.mode===statTab);
  const total=filtered.length, wins=filtered.filter(h=>h.result==='win').length;
  const loses=filtered.filter(h=>h.result==='lose').length;
  const rate=total>0?Math.round(wins/total*100):0;
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-win').textContent=wins;
  document.getElementById('st-lose').textContent=loses;
  document.getElementById('st-rate').textContent=total>0?rate+'%':'—';
  const fill=document.getElementById('wr-fill');
  fill.style.width=rate+'%';
  fill.className='winrate-fill'+(statTab==='sell'?' sell-fill':statTab==='all'?' all-fill':'');
  document.getElementById('wr-pct').textContent=rate+'%';
}

/* ═══ HISTORY ═══ */
function setHistFilter(f) {
  histFilter=f;
  ['all','buy','sell'].forEach(k => document.getElementById(`fb-${k}`).classList.toggle('active',k===f));
  renderHistory();
}

function renderHistory() {
  const container=document.getElementById('history-list');
  const history=getHistory();
  const filtered=histFilter==='all'?history:history.filter(h=>h.mode===histFilter);
  if(filtered.length===0){ container.innerHTML='<div class="empty-history">ยังไม่มีประวัติการเทรด</div>'; return; }
  container.innerHTML=filtered.map(t=>`
    <div class="history-item">
      <div class="h-type ${t.mode}">${t.mode.toUpperCase()}</div>
      <div>
        <div class="h-pair">${t.pair} <span style="color:var(--text-dim);font-size:9px;">${t.tf}</span></div>
        <div class="h-sub">${t.date}</div>
      </div>
      <div class="h-cond">✓ ${t.condCount}/${t.totalCond}</div>
      <div class="h-result ${t.result}">${t.result.toUpperCase()}</div>
    </div>`).join('');
}

function clearHistory() {
  if(!confirm('ล้างประวัติทั้งหมดของ '+currentUser.display+'?')) return;
  saveHistory([]);
  renderHistory(); updateStats();
}

/* ═══ INIT ═══ */
buildUserPills();
</script>
